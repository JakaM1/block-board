name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php84-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-
      - name: ESLint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
      - name: Laravel Pint
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint --test

  build:
    name: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: blockboard
          POSTGRES_USER: blockboard
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U blockboard -d blockboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build Vue and package Laravel
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          build-args: VITE_API_URL=/
          load: true
          tags: blockboard:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the production image
        env:
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          set -euo pipefail
          docker run --detach --name blockboard-ci --network host \
            -e "APP_KEY=base64:$(openssl rand -base64 32)" \
            -e APP_URL=http://127.0.0.1:10000 -e SANCTUM_STATEFUL_DOMAINS=127.0.0.1:10000 \
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT \
            -e DB_DATABASE=blockboard -e DB_USERNAME=blockboard -e DB_PASSWORD=ci-test-password \
            "blockboard:$GITHUB_SHA"
          trap 'docker logs blockboard-ci; docker rm --force blockboard-ci' EXIT
          base=http://127.0.0.1:10000
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 "$base/up" > /dev/null
          for path in / /najemi/1; do
            curl --fail --silent --show-error "$base$path" | grep -F '<div id="app"></div>'
          done
          curl --fail --silent --show-error "$base/sanctum/csrf-cookie" > /dev/null
          status=$(curl --silent --show-error --header 'Accept: application/json' \
            --output /dev/null --write-out '%{http_code}' "$base/api/me")
          test "$status" = 401
      - name: Export the tested image
        run: docker save "blockboard:$GITHUB_SHA" | gzip > blockboard-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: blockboard-image
          path: blockboard-image.tar.gz
          if-no-files-found: error
          compression-level: 0

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: blockboard_test
          POSTGRES_USER: blockboard
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U blockboard -d blockboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, zip
          coverage: pcov
          tools: composer:v2
      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php84-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php84-
      - run: npm ci
        working-directory: frontend
      - name: Prepare Laravel
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
      - name: Vitest with coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Pest with coverage
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_USERNAME: blockboard
          DB_PASSWORD: ci-test-password
        run: vendor/bin/pest --coverage --coverage-clover coverage/clover.xml --coverage-html coverage/html
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            frontend/coverage/
            backend/coverage/
          if-no-files-found: error

  deploy:
    name: deploy
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: ${{ steps.render.outputs.url }}
    concurrency:
      group: blockboard-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blockboard-image
      - name: Publish the verified image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$GITHUB_SHA" != "$latest_sha" ]]; then
            echo "A newer commit is on main. Skipping this deployment."
            exit 0
          fi
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$registry:$GITHUB_SHA"
          docker load -i blockboard-image.tar.gz
          docker tag "blockboard:$GITHUB_SHA" "$image"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image" | tee image-push.log
          digest=$(awk '/: digest: sha256:/ { print $3 }' image-push.log)
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::The registry did not return a valid image digest."
            exit 1
          fi
          echo "ref=$registry@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify on Render
        id: render
        if: steps.image.outputs.ref != ''
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "::error::Configure RENDER_API_KEY and RENDER_SERVICE_ID in the production environment."
            exit 1
          fi
          render_api() {
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $RENDER_API_KEY" "$@"
          }
          service="https://api.render.com/v1/services/$RENDER_SERVICE_ID"
          payload=$(jq -nc --arg image "$IMAGE_REF" '{imageUrl: $image}')
          deploy_id=$(render_api --json "$payload" "$service/deploys" | jq -er '.id')
          for attempt in {1..80}; do
            status=$(render_api "$service/deploys/$deploy_id" | jq -er '.status')
            echo "Render deployment status: $status"
            case "$status" in
              live)
                url=$(render_api "$service" | jq -er '.serviceDetails.url')
                curl --fail --silent --show-error --max-time 30 "$url/up" > /dev/null
                curl --fail --silent --show-error --max-time 30 "$url/" | grep -F '<div id="app"></div>'
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              build_failed|pre_deploy_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render did not finish deploying within the polling window."
          exit 1
